server:
  port: 8080

spring:
  application:
    name: study-space
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/study_space?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  # Redis：存登录状态（白名单 + 会话快照）和登录失败次数
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 本机开发没设密码，有密码时填 password
      timeout: 3s
      lettuce:
        shutdown-timeout: 200ms

mybatis-plus:
  configuration:
    #开启驼峰命名
    # 数据库下划线字段 -> Java 驼峰属性，如 student_no -> studentNo
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除：表里有 deleted 字段的实体自动生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：secret 至少 32 个字符（HS256 要求），生产环境请放到环境变量里
jwt:
  secret: study-space-jwt-secret-key-2026-campus-room-booking-system
  expire-minutes: 120

# 登录安全策略：连续失败若干次就锁定账号，防止暴力破解
login:
  # 连续失败多少次锁定
  max-fail-times: 5
  # 锁定时长（分钟）
  lock-minutes: 5
  # 失败次数统计窗口（分钟）：15 分钟内没再失败，计数自动清零
  fail-window-minutes: 15
  # 同一账号是否只允许一个有效会话（新登录把旧登录顶下线）
  single-session: true

# 预约规则：改这里就能调整业务参数，不用改 Java 代码
booking:
  # 每人每天最多预约几次
  daily-limit: 3
  # 单次预约最短时长（分钟），不足这个时长不允许提交
  min-duration-minutes: 60
  # 开始前多少分钟以外取消免费；以内取消算违约
  cancel-free-minutes: 15
  # 签到窗口：开始前 15 分钟开放、开始后 15 分钟截止，共 30 分钟
  check-in-early-minutes: 15
  check-in-late-minutes: 15
  # 信用分低于 limit 不能预约，并禁止预约 ban-days 天
  credit-limit: 60
  ban-days: 7
  # 违约扣分：超时未签到 / 临近开始取消
  no-show-deduct: 10
  late-cancel-deduct: 10

logging:
  level:
    com.studyspace.mapper: debug
